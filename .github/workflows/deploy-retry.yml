name: Retry Pages Deploy

# 自动重试 GitHub Pages 部署。
# 背景：GitHub Pages 后端偶尔拥堵，托管工作流 pages-build-deployment 的
# deploy-pages 步骤会在 10 分钟轮询超时后取消部署，导致站点更新不上。
# 本工作流每 30 分钟检查最新的 pages 部署 run，若失败则重跑，
# 待 GitHub 后端拥堵缓解后自动上线，无需人工干预。

on:
  schedule:
    - cron: '17,47 * * * *'   # 每整点 :17 与 :47 各一次
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Rerun latest failed Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api repos/${{ github.repository }}/actions/runs \
            --jq '.workflow_runs[] | select(.name=="pages build and deployment") | .id' \
            | head -1)
          echo "Latest pages deploy run id: $RUN_ID"
          gh run rerun "$RUN_ID" || echo "rerun failed (will retry next cycle)"
